trigger:
- main
pool:
  vmImage: ubuntu-latest
steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.12'
- script: |
    python -m pip install --upgrade pip
    pip install -r backend/requirements.txt
    cd backend
    python manage.py check
  displayName: Install dependencies and check Django
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
- script: |
    cd frontend
    npm install
    npm run build
  displayName: Build React frontend
